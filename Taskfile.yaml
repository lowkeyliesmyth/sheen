# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  spec:
    desc: Run Crystal specs
    cmds:
      #- crystal spec --order random
      - crystal spec

  lint:
    desc: Run Ameba linter
    deps: [lint:build]
    cmds:
      - bin/ameba

  lint:build:
    desc: Compile ameba linter
    cmds:
      - shards install
      - mkdir -p bin
      - crystal build -o bin/ameba lib/ameba/bin/ameba.cr
    status:
      - test -x bin/ameba
      - test bin/ameba -nt shard.lock

  coverage:
    desc: Run code coverage
    cmds:
      - scripts/coverage.sh

  actionlint:
    desc: Lint GitHub Actions workflows
    cmds:
      - actionlint

  unicode:
    desc: Download and generate unicode tables
    cmds:
      - crystal run scripts/gen_unicode.cr

  example:
    desc: Render one example to STDOUT (task example -- <name>)
    cmds:
      - crystal run examples/main.cr -- {{.CLI_ARGS}}

  examples:
    desc: Render every example to STDOUT
    cmds:
      - crystal run examples/main.cr -- all

  examples:check:
    desc: Type-check example consumers without running them
    cmds:
      - crystal build examples/main.cr --no-codegen

  docs:
    desc: Generates API usage docs from inline docstrings
    cmds:
      - crystal docs

  default:
    desc: Run default spec-lint checks
    deps: [spec, lint]
